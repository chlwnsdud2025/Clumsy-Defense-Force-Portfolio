schema: unity_so_text_patch_v1
encoding: UTF-8 with BOM
encoding_check: '한글 정상 표시 확인용: 공격력 증가 / 말랑 줄자 / 당근 캐논'
rules:
  string_fields: Korean names and descriptions are quoted by YAML dumper.
  icon_policy: Only use file names ending with Icon.png. Do not use files with _01, 01, or numbered variants.
  asset_key: Use asset as the primary matching key when patching Unity ScriptableObjects.
  safe_apply: Apply active entries first. Draft entries are included for review and should not be applied automatically unless
    explicitly requested.
